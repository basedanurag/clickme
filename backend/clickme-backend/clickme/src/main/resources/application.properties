spring.application.name=ClickMe

# Database Configuration (Defaults to local PostgreSQL, overridden in Production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clickme_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Server
server.port=${PORT:8080}

# ==========================
# JWT Configuration
# ==========================

jwt.secret=${JWT_SECRET:MyVeryStrongSecretKeyForClickMeApplication2026MyVeryStrongKey}
jwt.expiration=86400000

app.base-url=${APP_URL:http://localhost:8080}

# ==========================
# Jackson (JSON Serialization)
# ==========================
# Serialize Java 8+ date/time types (LocalDateTime etc.) as ISO-8601 strings.
# Prevents InvalidDefinitionException: Java 8 date/time type not supported.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# CORS allowed origins — comma-separated list.
# Override with ALLOWED_ORIGINS env var on Render to include your Netlify URL.
# Example: ALLOWED_ORIGINS=https://your-site.netlify.app,http://localhost:5173
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}