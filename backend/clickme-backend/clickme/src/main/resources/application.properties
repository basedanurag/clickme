spring.application.name=ClickMe

# Database Configuration (Defaults to local PostgreSQL, overridden in Production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clickme_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate — dialect is auto-detected; no need to set explicitly.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Disable open-in-view to prevent lazy-load issues and suppress startup warning.
spring.jpa.open-in-view=false

# Redis Configuration
# Required env vars for Upstash (or any TLS-enabled Redis):
#   REDIS_HOST   — e.g. shining-tortoise-195938.upstash.io
#   REDIS_PORT   — 6379
#   REDIS_PASSWORD — primary token (NOT the read-only token)
#   REDIS_SSL    — true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Server
server.port=${PORT:8080}

# ==========================
# JWT Configuration
# ==========================

jwt.secret=${JWT_SECRET:MyVeryStrongSecretKeyForClickMeApplication2026MyVeryStrongKey}
jwt.expiration=86400000

app.base-url=${APP_URL:http://localhost:8080}

# ==========================
# Google OAuth2 Configuration
# ==========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Ensure callback points to the correct backend domain in production, or localhost locally
spring.security.oauth2.client.registration.google.redirect-uri=${app.base-url}/login/oauth2/code/google

# ==========================
# Jackson (JSON Serialization)
# ==========================
# Serialize Java 8+ date/time types (LocalDateTime etc.) as ISO-8601 strings.
# Prevents InvalidDefinitionException: Java 8 date/time type not supported.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# CORS allowed origins — comma-separated list.
# Override with ALLOWED_ORIGINS env var on Render to include your Netlify URL.
# Example: ALLOWED_ORIGINS=https://your-site.netlify.app,http://localhost:5173
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
