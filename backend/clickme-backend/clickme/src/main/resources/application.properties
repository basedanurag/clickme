spring.application.name=ClickMe

# Database Configuration (Defaults to local PostgreSQL, overridden in Production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clickme_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# Server
server.port=${PORT:8080}

# ==========================
# JWT Configuration
# ==========================

jwt.secret=${JWT_SECRET:MyVeryStrongSecretKeyForClickMeApplication2026MyVeryStrongKey}
jwt.expiration=86400000

app.base-url=${APP_URL:http://localhost:8080}